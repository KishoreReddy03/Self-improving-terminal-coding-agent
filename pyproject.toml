[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-coding-agent"
version = "0.1.0"
description = "A self-improving terminal coding agent built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
